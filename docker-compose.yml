services:
  smtp:
    container_name: email-backend-1
    build:
      context: ./option2-raw-python
    command: ["python", "server.py"]
    restart: unless-stopped
    ports:
      - "25:1025"
    volumes:
      - ./option2-raw-python/data:/app/data

  web:
    container_name: email-frontend-1
    build:
      context: ./option2-raw-python
    command: ["python", "app.py"]
    restart: unless-stopped
    depends_on:
      - smtp
    ports:
      - "5000:5000"
    volumes:
      - ./option2-raw-python/data:/app/data
