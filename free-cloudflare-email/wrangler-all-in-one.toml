name = "inbox-orbit-mail-worker"
main = "worker-all-in-one.js"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "inbox-orbit-emails"
database_id = "<REPLACE_WITH_D1_DATABASE_ID>"

[[kv_namespaces]]
binding = "EMAILS_KV"
id = "<REPLACE_WITH_KV_NAMESPACE_ID>"

[[r2_buckets]]
binding = "ATTACHMENTS_R2"
bucket_name = "inbox-orbit-emails"

[vars]
LOVABLE_API_URL = "https://inbox-orbit-mail-viewer.lovable.app"
