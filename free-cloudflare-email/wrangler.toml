name = "free-email-gateway"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
LOVABLE_API_URL = "https://inbox-orbit-mail-viewer.lovable.app"
WEBHOOK_TOKEN = "free_token_123"

# Optional 100% Free Cloudflare D1 Database (from superhexa/temp-mail)
# Create with: npx wrangler d1 create inbox-orbit-db
# Apply schema: npx wrangler d1 execute inbox-orbit-db --file=./schema.sql
# [[d1_databases]]
# binding = "DB"
# database_name = "inbox-orbit-db"
# database_id = "your-d1-database-id-here"

# Optional 100% Free Cloudflare R2 Bucket for Attachments (from cloudflare/agentic-inbox)
# Create with: npx wrangler r2 bucket create inbox-orbit-attachments
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "inbox-orbit-attachments"
